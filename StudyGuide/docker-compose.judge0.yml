services:
  server:
    image: judge0/judge0:latest
    volumes:
      - ./.env.judge0:/judge0.conf:ro
    ports:
      - "127.0.0.1:2358:2358"
    privileged: true
    depends_on:
      - db
      - redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 100m
  workers:
    image: judge0/judge0:latest
    command: ["./scripts/workers"]
    volumes:
      - ./.env.judge0:/judge0.conf:ro
    privileged: true
    depends_on:
      - db
      - redis
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 100m
  db:
    image: postgres:16.2
    env_file: ./.env.judge0
    volumes:
      - judge0_data:/var/lib/postgresql/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 100m
  redis:
    image: redis:7.2.4
    command:
      - bash
      - -c
      - docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"
    env_file: ./.env.judge0
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 100m

volumes:
  judge0_data:
